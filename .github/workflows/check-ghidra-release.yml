name: Check for new Ghidra release

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-ghidra-release.sh

      - name: Create update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet; then
            echo "No update is available"
            exit 0
          fi

          version="$(sed -n 's/^ARG GHIDRA_VERSION=//p' Dockerfile.ghidra)"
          branch="automation/ghidra-${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${branch}"
          git add Dockerfile.ghidra docker-bake.hcl
          git commit -m "chore: update Ghidra to ${version}"
          git push --force origin "${branch}"
          if ! gh pr view "${branch}" >/dev/null 2>&1; then
            gh pr create \
              --base "${DEFAULT_BRANCH}" \
              --head "${branch}" \
              --title "chore: update Ghidra to ${version}" \
              --body "Automated weekly check found a newer official Ghidra release. Review and build all distribution targets before merging."
          fi
