name: Build and push Ghidra images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.ghidra
      - docker-bake.hcl
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - debian
          - ubuntu
          - fedora
          - rocky
          - almalinux
          - opensuse
    env:
      REGISTRY: docker.io
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/ghidra
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: true
          set: |
            ${{ matrix.target }}.cache-from=type=gha,scope=${{ matrix.target }}
            ${{ matrix.target }}.cache-to=type=gha,mode=max,scope=${{ matrix.target }}
